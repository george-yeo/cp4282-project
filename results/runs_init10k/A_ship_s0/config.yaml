paths:
  data: <data-root>/ship
  output: A_ship_s0/final.png
  init_ply: null
runtime:
  arch: gpu
  seed: 0
model:
  width: 400
  height: 400
  capacity: 10000
  initial_splats: 10000
  background: white
training:
  iterations: 20000
densification:
  fraction: 0.2
  opacity_reset_interval: 0
sparse:
  enabled: false
learning_rates:
  position_max_steps: 20000
  shape: 0.0005
convergence:
  enabled: false
reporting:
  log_every: 200
  eval_every: 200
  snapshot_every: 20000
  save_ply: true
kernel:
  type: gaussian
  learn_b: true
  b_init: 0.0
  b_min: -2.0
  b_max: 2.0
  moment_match_init: true
  moment_match: truncated
  densifier: course
  moment_dim: 2
